# Ports are published on 127.0.0.1 only. The AI service and Postgres are reachable only inside
# the compose network; everything goes through the gateway. Required in .env: POSTGRES_PASSWORD.
services:
  # Web UI + API gateway -> http://localhost:8090
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.go
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      AI_SERVICE_URL: http://ai_service:8000
      API_TOKEN: ${API_TOKEN:-}
    depends_on:
      - ai_service
    restart: unless-stopped

  ai_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobpilot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/jobpilot_db
      SEARXNG_URL: http://searxng:8080
    volumes:
      - ai_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: jobpilot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot -d jobpilot_db"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Exposed on 8081 so it does not clash with a standalone SearXNG on 8080.
  searxng:
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8081/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

volumes:
  postgres_data:
  ai_data:
