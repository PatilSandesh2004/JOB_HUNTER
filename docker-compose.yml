version: '3.8'

services:
  # 1. Go Backend Microservice (Port 8080)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.go
    container_name: jobpilot-backend-go
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AI_SERVICE_URL=http://ai_service:8000
      - ENVIRONMENT=production
    depends_on:
      - ai_service
      - postgres

  # 2. Python AI & Agent Microservice (Port 8000)
  ai_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    container_name: jobpilot-ai-python
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=JobPilot-AI-Engine
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://jobpilot:jobpilot123@postgres:5432/jobpilot_db
      - QDRANT_URL=http://qdrant:6333
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      - postgres
      - qdrant
      - searxng

  # 3. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: jobpilot-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=jobpilot
      - POSTGRES_PASSWORD=jobpilot123
      - POSTGRES_DB=jobpilot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 4. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: jobpilot-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # 5. SearXNG Search Engine
  searxng:
    image: searxng/searxng:latest
    container_name: jobpilot-searxng
    ports:
      - "8081:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
      - INSTANCE_NAME=JobPilot-SearXNG

volumes:
  postgres_data:
  qdrant_data:
