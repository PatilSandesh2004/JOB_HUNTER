# Minimal SearXNG config for JobPilot. JSON output is required by the AI service.
# Docs: https://docs.searxng.org/admin/settings/
use_default_settings: true

server:
  # Override with SEARXNG_SECRET in docker-compose / your environment.
  secret_key: "change-me"
  limiter: false   # the bot limiter blocks API clients like JobPilot
  image_proxy: true

search:
  formats:
    - html
    - json

# Extra general-web engines so one rate-limited engine (Google/Brave/DDG) does not starve results.
engines:
  - name: bing
    disabled: false
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false
