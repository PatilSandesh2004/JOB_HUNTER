# Alembic CLI config. The app runs migrations itself on startup (database/session.py:init_db);
# use the CLI to create new revisions:
#   alembic revision --autogenerate -m "describe the change"
# The database URL comes from DATABASE_URL / .env via the app settings, not from this file.
[alembic]
script_location = %(here)s/ai_service/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
